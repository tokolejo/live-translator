<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IICE 2026 - პროექტორის სცენა (Stage Display)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+GO:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
      background: #000;
    }
    .stage-helper-hint {
      position: fixed;
      top: 18px;
      right: 18px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
      z-index: 9999;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }
    .stage-announcement-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(24px);
      border: 2px solid rgba(56, 189, 248, 0.5);
      border-radius: 28px;
      padding: 44px 70px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85);
      z-index: 8000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .stage-announcement-card.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }
    .stage-announcement-icon {
      font-size: 60px;
      margin-bottom: 14px;
      display: block;
    }
    .stage-announcement-title {
      font-size: 42px;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    .stage-announcement-sub {
      font-size: 24px;
      color: #38bdf8;
      font-weight: 600;
    }
  </style>
</head>
<body class="style-oled-black">
  <div id="stageHint" class="stage-helper-hint">დააჭირეთ F ან ორჯერ დაკლიკეთ სრული ეკრანისთვის</div>

  <!-- Announcement Overlay Card (Intermission, Coffee break, Q&A) -->
  <div id="stageAnnouncement" class="stage-announcement-card">
    <span id="announcementIcon" class="stage-announcement-icon">☕</span>
    <div id="announcementTitle" class="stage-announcement-title">ყავის შესვენება</div>
    <div id="announcementSub" class="stage-announcement-sub">Coffee Break</div>
  </div>

  <!-- Stage Subtitles Container -->
  <main id="overlayContainer" class="overlay-container place-bottom align-center">
    <div id="subtitleCard" class="subtitle-card faded-out" style="width: 90%;">
      <!-- Original Text Row -->
      <div id="origRow" class="text-row orig-row">
        <span id="originalLangTag" class="tag-badge orig-badge">ORIG</span>
        <div id="originalText" class="speech-text original-text">
          <span>მზადაა ტრანსლაციისთვის...</span>
        </div>
      </div>

      <!-- Live Sync Translated Row -->
      <div id="transRow" class="text-row trans-row">
        <span id="targetLangTag" class="tag-badge trans-badge">TRANS</span>
        <div id="translatedText" class="speech-text translated-text">
          <span>IICE 2026 Conference Subtitles</span>
        </div>
      </div>
    </div>
  </main>

  <script src="stage.js"></script>
</body>
</html>
