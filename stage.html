<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IICE 2026 - პროექტორის სცენა (Stage Display)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+GO:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
    }
    .stage-helper-hint {
      position: fixed;
      top: 18px;
      right: 18px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
      z-index: 9999;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }
  </style>
</head>
<body class="style-oled-black align-center">
  <div id="stageHint" class="stage-helper-hint">დააჭირეთ F ან ორჯერ დაკლიკეთ სრული ეკრანისთვის</div>

  <!-- Announcement Overlay Card (Intermission, Coffee break, Q&A) -->
  <div id="stageAnnouncement" class="stage-announcement-card">
    <span id="announcementIcon" class="stage-announcement-icon">☕</span>
    <div id="announcementTitle" class="stage-announcement-title">ყავის შესვენება</div>
    <div id="announcementSub" class="stage-announcement-sub">Coffee Break</div>
  </div>

  <!-- Stage Subtitle Overlay Container (Exact match with index.html classes) -->
  <main id="overlayContainer" class="overlay-container pos-bottom">
    <div class="subtitle-card" id="subtitleCard">
      <!-- Original Speech Layer -->
      <div class="speech-layer original-layer" id="originalLayer">
        <span class="tag-badge" id="originalLangTag">ENG</span>
        <p class="speech-text original-text" id="originalText">
          <span class="placeholder-hint">მზადაა პროექტორის ტრანსლაციისთვის...</span>
        </p>
      </div>

      <!-- Translation Layer -->
      <div class="speech-layer translated-layer" id="translatedLayer">
        <span class="tag-badge trans-badge" id="targetLangTag">GEO</span>
        <p class="speech-text translated-text" id="translatedText">
          <span class="placeholder-hint">IICE 2026 Live Subtitles Ready</span>
        </p>
      </div>

      <!-- Active Glowing Line -->
      <div class="active-glow-line" id="glowLine"></div>
    </div>
  </main>

  <script src="stage.js"></script>
</body>
</html>
